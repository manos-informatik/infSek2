<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wiederholung Processing</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="app-shell">
    <header class="app-header">
      <div>
        <p class="eyebrow">Algorithmen</p>
        <h1>Wiederholung Processing</h1>
      </div>
      <p id="runStatus" class="status-pill" aria-live="polite">Bereit</p>
    </header>

    <nav class="example-selector" aria-label="Codebeispiel auswählen">
      <span class="example-selector-label">Beispiel:</span>
      <div class="example-buttons">
        <button class="example-button is-active" type="button" data-example="example1" aria-pressed="true">Bsp1</button>
        <button class="example-button" type="button" data-example="example2" aria-pressed="false">Bsp2</button>
        <button class="example-button" type="button" data-example="example3" aria-pressed="false">Bsp3</button>
      </div>
    </nav>

    <section class="workspace" aria-label="Interaktive Processing-Simulation">
      <section class="panel code-panel" aria-labelledby="codeTitle">
        <div class="panel-heading">
          <h2 id="codeTitle">Code</h2>
          <div class="panel-actions">
            <button id="showDiagramButton" class="button button-secondary button-small" type="button">Struktogramm anzeigen</button>
            <button id="copyCodeButton" class="button button-secondary button-small" type="button">Code kopieren</button>
          </div>
        </div>

        <pre class="code-block" aria-label="Processing-Code"><code><span class="code-line" id="lineSetup">void <span class="keyword">setup</span>(){</span><span class="code-line code-indent" id="lineSize"><span class="fn">size</span>(<input id="sizeWidth" class="code-input" type="text" inputmode="numeric" value="400" data-min="50" data-max="400" data-fallback="400" aria-label="Breite der Zeichenfläche">,<input id="sizeHeight" class="code-input" type="text" inputmode="numeric" value="400" data-min="50" data-max="400" data-fallback="400" aria-label="Höhe der Zeichenfläche">);</span><span class="code-line code-indent" id="lineBackground"><span class="fn">background</span>(<input id="backgroundR" class="code-input" type="text" inputmode="numeric" value="255" data-min="0" data-max="255" data-fallback="255" aria-label="Rotwert der Hintergrundfarbe">,<input id="backgroundG" class="code-input" type="text" inputmode="numeric" value="255" data-min="0" data-max="255" data-fallback="255" aria-label="Grünwert der Hintergrundfarbe">,<input id="backgroundB" class="code-input" type="text" inputmode="numeric" value="255" data-min="0" data-max="255" data-fallback="255" aria-label="Blauwert der Hintergrundfarbe">);</span><span class="code-line code-indent" id="lineStroke"><span class="fn">strokeWeight</span>(<input id="strokeWeight" class="code-input" type="text" inputmode="numeric" value="20" data-min="1" data-max="50" data-fallback="20" aria-label="Punktgröße">);</span><span class="code-line">}</span><span class="code-group" id="drawBlock"><span class="code-line" id="lineDraw">void <span class="keyword">draw</span>(){</span><span class="code-line code-indent" id="lineIf">if(<span id="mousePressedToken" class="mouse-token is-inactive">mousePressed</span>){</span><span class="code-line code-double-indent" id="linePoint"><span class="fn">point</span>(<span id="pointArguments" class="point-values">mouseX,mouseY</span>);</span><span class="code-line code-indent">}</span><span class="code-line">}</span></span></code></pre>

        <div class="stroke-preview" aria-label="strokeWeight-Vorschau">
          <span>strokeWeight-Vorschau</span>
          <span class="stroke-preview-field">
            <span id="strokePreviewDot" class="stroke-preview-dot"></span>
          </span>
        </div>
      </section>

      <section class="panel experiment-panel" aria-labelledby="canvasTitle">
        <div class="panel-heading">
          <h2 id="canvasTitle">Zeichenfeld</h2>
          <p class="counter" aria-live="polite">draw()-Durchläufe: <span id="drawCounter">0</span></p>
        </div>

        <div class="canvas-board">
          <div class="canvas-viewport" aria-label="Maximale Zeichenfläche 400 mal 400 Pixel">
            <div id="canvasStack" class="canvas-stack">
              <canvas id="drawingCanvas" class="drawing-layer" width="400" height="400" aria-label="Zeichenfläche"></canvas>
              <canvas id="gridCanvas" class="grid-layer" width="400" height="400" aria-hidden="true"></canvas>
            </div>
          </div>
        </div>

        <div class="controls" aria-label="Steuerung">
          <button id="startButton" class="button button-primary" type="button">Start</button>
          <button id="resetButton" class="button button-secondary" type="button">Zurücksetzen</button>
        </div>
      </section>
    </section>
  </main>

  <!-- Struktogramm-Modal/Overlay -->
  <div id="diagramOverlay" class="overlay" aria-hidden="true" role="dialog" aria-labelledby="diagramTitle">
    <div class="overlay-content">
      <h3 id="diagramTitle" class="overlay-title">Struktogramm</h3>
      <img src="EinfuehrungStruktogramm.png" alt="Struktogramm für setup() und draw()" class="diagram-image">
    </div>
  </div>
</body>
</html>
